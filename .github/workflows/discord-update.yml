name: Manual Discord update notification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Send Arabic update announcement to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::إعداد رابط إشعارات Discord غير موجود."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          payload = {
              "username": "إشعارات البوت",
              "embeds": [{
                  "title": "تم نشر تحديث جديد للبوت",
                  "description": "سيُعاد تشغيل البوت تلقائيًا لتطبيق التحديث.",
                  "color": 5793266
              }],
              "allowed_mentions": {"parse": []}
          }
          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "GitHub-Actions-Update-Notifier"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord webhook returned HTTP {response.status}")
          PY
