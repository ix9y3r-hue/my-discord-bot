name: Python tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application modules
        run: python -m py_compile main.py temp_voice.py youtube_cookie_monitor.py youtube_piped.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
