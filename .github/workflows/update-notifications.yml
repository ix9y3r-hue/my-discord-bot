name: Discord Update Notifications

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Send update announcement to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_TITLE: ${{ github.event.head_commit.message || 'تحديث يدوي للمشروع' }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Missing DISCORD_WEBHOOK_URL repository secret."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          title = os.environ.get("COMMIT_TITLE", "تحديث جديد للبوت").splitlines()[0][:240]
          # Translate the actual commit summary into Arabic; use an Arabic fallback if unavailable.
          try:
              query = urllib.parse.urlencode({
                  "client": "gtx", "sl": "auto", "tl": "ar", "dt": "t", "q": title
              })
              with urllib.request.urlopen(
                  "https://translate.googleapis.com/translate_a/single?" + query,
                  timeout=8,
              ) as translation_response:
                  translated = json.loads(translation_response.read().decode("utf-8"))
              arabic_title = "".join(part[0] for part in translated[0] if part and part[0]).strip()
              if not arabic_title:
                  raise ValueError("Empty translation")
          except Exception:
              arabic_title = "تم تطبيق تحديث جديد على البوت."
          payload = {
              "username": "إشعارات البوت",
              "embeds": [{
                  "title": "تم نشر تحديث جديد للبوت",
                  "description": f"**ملخص التغييرات:**\n{arabic_title}\n\nسيُعاد تشغيل البوت تلقائيًا لتطبيق التحديث.",
                  "color": 5793266,
              }],
              "allowed_mentions": {"parse": []},
          }
          data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=data,
              headers={"Content-Type": "application/json", "User-Agent": "GitHub-Actions-Update-Notifier"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord webhook returned HTTP {response.status}")
              print("Discord update announcement sent.")
          PY
