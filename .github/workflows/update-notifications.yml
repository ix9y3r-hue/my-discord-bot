name: Discord Update Notifications

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel older pending announcements so rapid edits are bundled into one message.
concurrency:
  group: discord-update-announcement
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the current batch of changes
        run: sleep 90

      - name: Get latest changes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build one Arabic update announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Missing Discord webhook configuration."
            exit 1
          fi

          # Find the last successful notification, then include every commit since it.
          LAST_SHA=$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/update-notifications.yml/runs?status=success&per_page=1" \
            | jq -r '.workflow_runs[0].head_sha // empty')

          if [ -n "$LAST_SHA" ] && git cat-file -e "$LAST_SHA^{commit}" 2>/dev/null; then
            CHANGELOG=$(git log "$LAST_SHA..HEAD" --format=%s --reverse | head -n 12)
          else
            CHANGELOG=$(git log -n 8 --format=%s --reverse HEAD)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="تحديث جديد على البوت"
          fi

          export CHANGELOG
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          raw_changes = os.environ.get("CHANGELOG", "تحديث جديد على البوت").strip()
          changes = [line.strip() for line in raw_changes.splitlines() if line.strip()]
          combined = "\n".join(f"• {line}" for line in changes)[:2500]

          # Translate the full batch of commit summaries into Arabic.
          try:
              query = urllib.parse.urlencode({
                  "client": "gtx", "sl": "auto", "tl": "ar", "dt": "t", "q": combined
              })
              with urllib.request.urlopen(
                  "https://translate.googleapis.com/translate_a/single?" + query,
                  timeout=10,
              ) as response:
                  translated = json.loads(response.read().decode("utf-8"))
              arabic_changes = "".join(
                  part[0] for part in translated[0] if part and part[0]
              ).strip()
              if not arabic_changes:
                  raise ValueError("Empty translation")
          except Exception:
              arabic_changes = "تم تطبيق مجموعة من التحديثات والإصلاحات الجديدة."

          payload = {
              "username": "إشعارات البوت",
              "embeds": [{
                  "title": "تم تحديث البوت",
                  "description": (
                      "**ملخص التغييرات:**\n"
                      + arabic_changes
                      + "\n\nسيُعاد تشغيل البوت تلقائيًا لتطبيق التحديثات."
                  )[:4000],
                  "color": 5793266,
              }],
              "allowed_mentions": {"parse": []},
          }
          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Discord-Update-Notifier",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord webhook returned HTTP {response.status}")
              print("Combined Arabic update announcement sent.")
          PY
